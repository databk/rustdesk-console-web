name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-management-tests:
    name: Server API and access tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand src/access.test.ts src/services/rustdesk-console/server.test.ts src/pages/roles/rbacPresentation.test.ts

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome lint
        run: npx @biomejs/biome lint

      - name: Biome format check
        run: npx @biomejs/biome format --diagnostic-level=error

      - name: TypeScript type check
        run: npx tsc --noEmit
