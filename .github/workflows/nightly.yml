name: Nightly Build

on:
  schedule:
    # Run daily at 00:00 CST (16:00 UTC)
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-build
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  check-changes:
    name: Check for New Commits
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if new commits since last nightly
        id: check
        run: |
          # Check if the nightly tag exists
          if ! git rev-parse "nightly" >/dev/null 2>&1; then
            echo "No previous nightly tag found, proceeding with build"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count commits since the nightly tag
          NEW_COMMITS=$(git rev-list "nightly..HEAD" --count 2>/dev/null || echo "0")

          if [ "$NEW_COMMITS" -gt 0 ]; then
            echo "Found ${NEW_COMMITS} new commits since last nightly, proceeding with build"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits since last nightly, skipping build"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Nightly Artifacts
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-dist
          path: dist/
          retention-days: 7

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: build
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: x86_64-apple-darwin
            os: macos-26-intel
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: nightly-dist
          path: dist/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        working-directory: server
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary with target suffix
        shell: bash
        run: |
          cp "server/target/${{ matrix.target }}/release/rustdesk-console-web${{ matrix.ext }}" "server/target/${{ matrix.target }}/release/rustdesk-console-web-${{ matrix.target }}${{ matrix.ext }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: server/target/${{ matrix.target }}/release/rustdesk-console-web-${{ matrix.target }}${{ matrix.ext }}

  release:
    name: Create Nightly GitHub Release
    needs: [build, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine nightly version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.version' package.json)
          DATE=$(date -u +%Y%m%d)
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${DATE}"
          echo "version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Delete existing nightly release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "nightly" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":nightly" 2>/dev/null || true
          git tag -d "nightly" 2>/dev/null || true

      - name: Generate changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          tag-prefix: ''
          skip-commit: 'true'
          skip-tag: 'true'

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: nightly-dist
          path: dist/

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binaries/
          merge-multiple: true

      - name: Create release archive
        run: |
          cd dist
          tar -czf ../rustdesk-console-web-nightly.tar.gz .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: true
          files: |
            rustdesk-console-web-nightly.tar.gz
            binaries/*

  docker:
    name: Publish Nightly Docker Image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine nightly version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.version' package.json)
          DATE=$(date -u +%Y%m%d)
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${DATE}"
          echo "version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            docker.io/databk/rustdesk-console-web:nightly
          labels: |
            org.opencontainers.image.title=rustdesk-console-web
            org.opencontainers.image.description=Nightly build of RustDesk Console Web
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

