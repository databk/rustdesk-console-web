name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *' # UTC 00:00 daily
  workflow_dispatch:

concurrency:
  group: nightly-build
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  check-changes:
    name: Check for New Commits
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if new commits since last nightly
        id: check
        run: |
          # Get the date of the last nightly tag
          LAST_NIGHTLY=$(git tag -l "v*-nightly.*" --sort=-version:refname | head -n 1)

          if [ -z "$LAST_NIGHTLY" ]; then
            echo "No previous nightly tag found, proceeding with build"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_NIGHTLY_DATE=$(echo "$LAST_NIGHTLY" | grep -oP '\d{8}')
          TODAY=$(date -u +%Y%m%d)

          # Count commits since the last nightly tag
          NEW_COMMITS=$(git rev-list "${LAST_NIGHTLY}..HEAD" --count 2>/dev/null || echo "0")

          if [ "$NEW_COMMITS" -gt 0 ]; then
            echo "Found ${NEW_COMMITS} new commits since last nightly (${LAST_NIGHTLY}), proceeding with build"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits since last nightly (${LAST_NIGHTLY}), skipping build"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Nightly Artifacts
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-dist
          path: dist/
          retention-days: 7

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: build
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: nightly-dist
          path: dist/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        working-directory: server
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd server/target/${{ matrix.target }}/release
          tar -czf ../../../rustdesk-console-web-${{ matrix.target }}.tar.gz rustdesk-console-web

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: server/target/${{ matrix.target }}/release
        run: Compress-Archive -Path rustdesk-console-web.exe -DestinationPath ../../../rustdesk-console-web-${{ matrix.target }}.zip

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            server/rustdesk-console-web-${{ matrix.target }}.tar.gz
            server/rustdesk-console-web-${{ matrix.target }}.zip

  release:
    name: Create Nightly GitHub Release
    needs: [build, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine nightly version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.version' package.json)
          DATE=$(date -u +%Y%m%d)
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${DATE}"
          echo "version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Delete existing nightly release for today (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Generate changelog
        id: changelog
        run: |
          # Find the last stable tag (not nightly)
          LAST_STABLE=$(git tag -l "v[0-9]*" --sort=-version:refname | grep -v "nightly" | head -n 1)

          if [ -n "$LAST_STABLE" ]; then
            COMMITS=$(git log "${LAST_STABLE}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -50)
          fi

          # Write changelog to file for multi-line output
          {
            echo "## Nightly Build ${{ steps.version.outputs.version }}"
            echo ""
            echo "This is an automated nightly build. **Not recommended for production use.**"
            echo ""
            if [ -n "$LAST_STABLE" ]; then
              echo "### Changes since ${LAST_STABLE}"
            else
              echo "### Recent Changes"
            fi
            echo ""
            echo "$COMMITS"
          } > CHANGELOG_NIGHTLY.md

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: nightly-dist
          path: dist/

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binaries/
          merge-multiple: true

      - name: Create release archive
        run: |
          cd dist
          tar -czf ../rustdesk-console-web-${{ steps.version.outputs.version }}.tar.gz .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nightly ${{ steps.version.outputs.version }}
          body_path: CHANGELOG_NIGHTLY.md
          draft: false
          prerelease: true
          files: |
            rustdesk-console-web-${{ steps.version.outputs.version }}.tar.gz
            binaries/*

  docker:
    name: Publish Nightly Docker Image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.version' package.json)
          DATE=$(date -u +%Y%m%d)
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${DATE}"
          echo "version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rustdesk-console-web:nightly
          labels: |
            org.opencontainers.image.title=rustdesk-console-web
            org.opencontainers.image.description=Nightly build of RustDesk Console Web
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    name: Cleanup Old Nightly Releases
    needs: [release, docker]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete old nightly releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RETENTION_DAYS=7
          TODAY=$(date -u +%Y%m%d)
          CUTOFF=$((TODAY - RETENTION_DAYS))

          echo "Cleaning up nightly releases older than ${RETENTION_DAYS} days..."
          echo "Cutoff date: ${CUTOFF}"

          # List all nightly tags sorted by version (newest first)
          git tag -l "v*-nightly.*" --sort=-version:refname | while read -r TAG; do
            TAG_DATE=$(echo "$TAG" | grep -oP '\d{8}')

            if [ -z "$TAG_DATE" ]; then
              continue
            fi

            # Skip if tag date is within retention period
            if [ "$TAG_DATE" -ge "$CUTOFF" ]; then
              echo "Keeping: ${TAG} (date: ${TAG_DATE})"
              continue
            fi

            echo "Removing: ${TAG} (date: ${TAG_DATE})"

            # Delete the GitHub release
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

            # Delete the remote tag (in case cleanup-tag didn't work)
            git push origin ":${TAG}" 2>/dev/null || true

            # Delete the local tag
            git tag -d "$TAG" 2>/dev/null || true
          done

          echo "Cleanup complete"
