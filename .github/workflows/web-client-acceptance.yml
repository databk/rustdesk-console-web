name: Web Client 验收镜像

on:
  push:
    branches: [web-client-v2-acceptance]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-client-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'yardbirds0' && github.ref == 'refs/heads/web-client-v2-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: 生成可追溯的验收标签
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=web-client-v2-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: 从本次源码构建 Linux amd64 检查阶段
        run: docker build --platform linux/amd64 --build-arg "WEB_CLIENT_SOURCE_URL=https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA" --target builder -t web-client-frontend-check:local .
      - name: 校验固定协议和 TypeScript
        run: |
          docker run --rm --network none --cpus 2 --memory 3g web-client-frontend-check:local npm run web-client:protocol:check
          docker run --rm --network none --cpus 2 --memory 3g web-client-frontend-check:local npm run tsc
      - name: 串行执行前端回归
        run: docker run --rm --network none --cpus 2 --memory 3g -e CI=true web-client-frontend-check:local npm test -- --runInBand --detectOpenHandles
      - name: 构建生产镜像
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build --platform linux/amd64 --build-arg "WEB_CLIENT_SOURCE_URL=https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$TAG" \
            -t "$IMAGE:$TAG" -t "$IMAGE:web-client-v2-acceptance" .
      - name: 验收 Nginx 页面与自包含 Worker
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          docker run -d --name web-client-frontend-smoke --cpus 1 --memory 256m \
            -p 127.0.0.1:18080:80 -e BACKEND_URL=http://127.0.0.1:9 "$IMAGE:$TAG"
          node deploy/web-client/smoke.cjs http://127.0.0.1:18080 | tee smoke-result.json
      - name: 登录并推送验收镜像
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:web-client-v2-acceptance"
          docker image inspect "$IMAGE:$TAG" --format '{{json .RepoDigests}}' > image-digests.json
          printf '### 前端验收镜像\n\n`%s:%s`\n\n源码：`%s`\n' "$IMAGE" "$TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat image-digests.json >> "$GITHUB_STEP_SUMMARY"
      - name: 保存验收证据
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-image-evidence
          path: |
            smoke-result.json
            image-digests.json
          retention-days: 14
      - name: 清理本次临时容器
        if: always()
        run: docker rm -f web-client-frontend-smoke || true
