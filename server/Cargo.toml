[package]
name = "rustdesk-console-web"
version = "1.3.0"
edition = "2024"
description = "Standalone web server for RustDesk Console"

[dependencies]
actix-web = "4"
rust-embed = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mime_guess = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "s"
lto = true
strip = true
